<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plan Georgia State accounting classes, track internship applications, and see which skills to learn next.">
<title>Internship Ledger</title>
<style>
/* Light only. Neutral surfaces, GSU blue for actions and planned work, one color per
   requirement group, green/blue/amber/gray for skill status, red only when a rule is broken. */
:root {
  --radius: 0.625rem;
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --primary: oklch(0.42 0.19 263);
  --primary-foreground: oklch(0.985 0 0);
  --primary-soft: oklch(0.42 0.19 263 / 0.1);
  --secondary: oklch(0.97 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.955 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --destructive-soft: oklch(0.577 0.245 27.325 / 0.08);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --board: oklch(0.948 0 0);
  --sidebar: oklch(0.985 0 0);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.06), 0 1px 3px oklch(0 0 0 / 0.04);
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  /* Requirement groups: one color each, used everywhere the group appears */
  --g-lower: oklch(0.52 0.04 255);
  --g-foundation: oklch(0.56 0.11 185);
  --g-core: oklch(0.52 0.18 300);
  --g-major: oklch(0.42 0.19 263);
  --g-senior: oklch(0.62 0.16 55);
  /* Skill status: green have, blue studying, amber partly, gray not yet */
  --ok: oklch(0.55 0.14 150);
  --ok-soft: oklch(0.55 0.14 150 / 0.12);
  --warn: oklch(0.62 0.14 70);
  --warn-soft: oklch(0.72 0.14 80 / 0.18);
  /* Skill categories */
  --c-acct: oklch(0.5 0.16 263);
  --c-soft: oklch(0.52 0.11 190);
  --c-people: oklch(0.56 0.17 5);
  /* Application status */
  --st-todo: oklch(0.55 0.03 255);
  --st-wip: oklch(0.5 0.19 263);
  --st-applied: oklch(0.52 0.18 300);
  --st-interview: oklch(0.63 0.16 55);
  --st-offer: oklch(0.55 0.14 150);
  --st-closed: oklch(0.68 0 0);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--background); color: var(--foreground);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--primary) 60%, transparent); outline-offset: 1px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.muted { color: var(--muted-foreground); }
.ico { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 12px; height: 12px; }
.ico.lg { width: 16px; height: 16px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* App shell */
.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.topbar { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--background); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; white-space: nowrap; }
.brand .ico { color: var(--primary); width: 18px; height: 18px; }
.vsep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex: none; }
.spacer { flex: 1; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--muted); }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; }
.seg button:hover { color: var(--foreground); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted-foreground); }
.sync[data-state="account"]::before { background: var(--primary); }
.sync[data-state="error"]::before { background: var(--destructive); }
.banner { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 12px; font-size: 12px; background: var(--muted); border-bottom: 1px solid var(--border); flex-wrap: wrap; text-align: center; }

.rail { flex: none; display: flex; align-items: center; gap: 24px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.rail-groups { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.grp-lower { --g: var(--g-lower); }
.grp-foundation { --g: var(--g-foundation); }
.grp-core { --g: var(--g-core); }
.grp-major { --g: var(--g-major); }
.grp-senior { --g: var(--g-senior); }
.grp-elective { --g: var(--muted-foreground); }
.gdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--g, var(--muted-foreground)); flex: none; }
.rg { display: grid; gap: 6px; text-align: left; min-width: 0; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--g) 7%, transparent); border: 1px solid color-mix(in srgb, var(--g) 22%, transparent); }
.rg:hover { background: color-mix(in srgb, var(--g) 12%, transparent); }
.rg .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--g); white-space: nowrap; }
.rg .top .gl { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.rg .top .mono { color: var(--foreground); font-size: 12.5px; }
.rg .bar { display: flex; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--g) 12%, var(--background)); overflow: hidden; }
.rg .bar span { display: block; height: 100%; }
.rg .bar .d { background: var(--g); }
.rg .bar .p { background: color-mix(in srgb, var(--g) 40%, transparent); }
.rg .bar .b { background: var(--destructive); }
.rail-stats { flex: none; display: flex; align-items: center; gap: 14px; white-space: nowrap; font-size: 12px; color: var(--muted-foreground); }
.rail-stats b { font-weight: 600; color: var(--foreground); }
@media (max-width: 900px) {
  .rail { flex-wrap: wrap; gap: 8px 16px; }
  .rail-groups { flex-basis: 100%; grid-template-columns: repeat(5, minmax(56px, 1fr)); gap: 10px; }
  .rg .top > span:first-child { overflow: hidden; text-overflow: ellipsis; }
}

.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; }
.pane { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.pane.side { background: var(--sidebar); }
.pane.left { border-right: 1px solid var(--border); }
.pane.right { border-left: 1px solid var(--border); }
.pane.center { background: var(--board); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.pane-head { flex: none; display: grid; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
.pane-foot { flex: none; padding: 6px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted-foreground); }
.mobile-tabs { display: none; }

/* Controls */
.input, select.input, textarea.input {
  width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--input); border-radius: 8px; background: var(--background); font-size: 13px; box-shadow: var(--shadow);
}
textarea.input { height: auto; min-height: 140px; padding: 8px 10px; resize: vertical; line-height: 1.45; }
.input:focus { outline: 2px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 0; }
.search { position: relative; }
.search .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); }
.search .input { padding-left: 30px; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px; }
.toggle { height: 26px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); border: 1px solid transparent; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.toggle:hover { background: var(--accent); color: var(--foreground); }
.toggle[aria-pressed="true"] { background: var(--accent); color: var(--foreground); border-color: var(--border); }
.toggle .n { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); background: var(--background); box-shadow: var(--shadow); }
.btn:hover { background: var(--accent); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted-foreground); }
.btn.ghost:hover { background: var(--accent); color: var(--foreground); }
.btn.dashed { border-style: dashed; background: transparent; box-shadow: none; color: var(--muted-foreground); width: 100%; }
.btn.dashed:hover { color: var(--foreground); background: var(--card); }
.btn.danger { color: var(--destructive); }
.btn.danger.armed { background: var(--destructive); border-color: var(--destructive); color: var(--background); }
.btn:disabled { opacity: 0.5; cursor: default; }
.icon-btn { width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 6px; color: var(--muted-foreground); flex: none; }
.icon-btn:hover { background: var(--accent); color: var(--foreground); }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 500; border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
.badge.mono { font-size: 10.5px; }
.badge.primary { border-color: transparent; background: var(--primary-soft); color: var(--primary); }
.badge.ok { border-color: transparent; background: var(--ok-soft); color: var(--ok); }
.badge.ok-solid { border-color: transparent; background: var(--ok); color: #fff; }
.badge.warn { border-color: transparent; background: var(--warn-soft); color: var(--warn); }
.badge.grp { border-color: transparent; background: color-mix(in srgb, var(--g) 13%, transparent); color: var(--g); }
.badge.solid { border-color: transparent; background: var(--primary); color: var(--primary-foreground); }
.badge.bad { border-color: transparent; background: var(--destructive-soft); color: var(--destructive); }
.kicker { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground); }
.group-label { padding: 4px 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground); background: color-mix(in srgb, var(--muted) 60%, transparent); }
.group-label[class*="grp-"] { display: flex; align-items: center; gap: 7px; padding: 6px 12px; font-size: 11px; color: var(--g); background: color-mix(in srgb, var(--g) 8%, var(--sidebar)); border-left: 3px solid var(--g); }

/* Library rows */
.lib-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 8px 12px; border-left: 3px solid transparent; border-bottom: 1px solid var(--border); cursor: pointer; }
.lib-row:hover { background: var(--accent); }
.lib-row.on { border-left-color: var(--g, var(--primary)); }
.lib-row .l1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.lib-row .code { font-family: var(--font-mono); font-size: 12px; font-weight: 700; white-space: nowrap; }
.lib-row .title { font-size: 12px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lib-row .l2 { grid-column: 1; display: flex; gap: 10px; font-size: 11px; color: var(--muted-foreground); }
.lib-row .end { grid-row: 1 / span 2; grid-column: 2; }

/* Board */
.board { padding: 16px 16px 40px; display: grid; gap: 22px; container-type: inline-size; }
.year { display: grid; gap: 8px; }
.year-label { display: flex; align-items: center; gap: 12px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; color: var(--muted-foreground); }
.year-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.terms { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
@container (min-width: 560px) { .terms { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (min-width: 900px) { .terms { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.term { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; cursor: default; transition: box-shadow 0.15s, border-color 0.15s; }
.term:hover { box-shadow: 0 4px 12px oklch(0 0 0 / 0.08); }
.term.focus { border-color: color-mix(in srgb, var(--primary) 60%, transparent); box-shadow: 0 0 0 3px var(--primary-soft); }
.term.over { border-color: var(--destructive); }
.term.drop { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.lib-row[draggable="true"], .slot { cursor: grab; }
body.dragging .empty-slot { border-color: color-mix(in srgb, var(--primary) 60%, transparent); color: var(--primary); }
.kbd { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted-foreground); background: var(--background); }
dialog.dlg.palette { margin-top: 12vh; width: min(600px, calc(100% - 32px)); }
.pal-search { padding: 10px; border-bottom: 1px solid var(--border); }
.pal-list { max-height: min(52vh, 460px); overflow-y: auto; padding: 6px; display: grid; gap: 1px; }
.pal-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; text-align: left; font-size: 13px; width: 100%; }
.pal-item[aria-selected="true"] { background: var(--accent); }
.pal-item .pal-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-item .pal-hint { font-size: 11px; color: var(--muted-foreground); }
.summary { max-width: 780px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 14px; }
.summary-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.summary-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.sum-row { display: grid; grid-template-columns: 170px 1fr auto; gap: 4px 12px; padding: 8px 16px; border-top: 1px solid var(--border); font-size: 13px; align-items: baseline; }
.sum-row:first-child { border-top: 0; }
.sum-row .k { font-weight: 500; }
.sum-row .v { color: var(--muted-foreground); min-width: 0; }
.sum-row .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
.sum-term { padding: 10px 16px; border-top: 1px solid var(--border); display: grid; gap: 4px; }
.sum-term:first-child { border-top: 0; }
.sum-term .hd { display: flex; justify-content: space-between; font-weight: 600; font-size: 13.5px; }
.sum-term .ln { display: grid; grid-template-columns: 84px 1fr auto; gap: 8px; font-size: 13px; }
.sum-term .ln .mono { font-weight: 600; font-size: 12px; }
@media (max-width: 560px) { .sum-row { grid-template-columns: 1fr auto; } .sum-row .v { grid-column: 1 / -1; } }
.term-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
.term-head h3 { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.term-meta { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
.term-meta.over { color: var(--destructive); font-weight: 600; }
.term-body { border-top: 1px solid var(--border); padding: 10px; display: grid; gap: 6px; }
.slot { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; border-left: 3px solid var(--border); background: color-mix(in srgb, var(--secondary) 60%, transparent); cursor: pointer; min-width: 0; }
.slot:hover { background: var(--accent); border-color: var(--border); }
.slot.req { border-left-color: var(--g, var(--primary)); }
.slot.bad { border-left-color: var(--destructive); background: var(--destructive-soft); }
.slot .code { font-family: var(--font-mono); font-size: 13px; font-weight: 700; white-space: nowrap; }
.slot .title { flex: 1; min-width: 0; font-size: 13px; color: color-mix(in srgb, var(--foreground) 75%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .warn { color: var(--destructive); display: inline-flex; }
.slot .rm { opacity: 0; }
.slot:hover .rm, .slot .rm:focus-visible { opacity: 1; }
.empty-slot { border: 1px dashed var(--border); border-radius: 8px; padding: 14px 8px; text-align: center; font-size: 12px; color: var(--muted-foreground); }

/* Checklist */
.verdict { padding: 14px 12px; border-bottom: 1px solid var(--border); display: grid; gap: 2px; }
.verdict .headline { font-size: 16px; font-weight: 500; line-height: 1.3; }
.verdict .headline.ok { color: var(--primary); }
.verdict .headline.bad { color: var(--destructive); }
.verdict .detail { font-size: 12px; color: var(--muted-foreground); }
.checks { padding: 8px; display: grid; gap: 1px; }
.check { border-radius: 6px; }
.check > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.check > summary::-webkit-details-marker { display: none; }
.check > summary:hover { background: var(--accent); }
.check > summary .lbl { flex: 1; min-width: 0; }
.check > summary .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
.check .i-ok { color: var(--ok); }
.check .i-bad { color: var(--destructive); }
.check .i-open { color: color-mix(in srgb, var(--muted-foreground) 70%, transparent); }
.check-body { padding: 2px 8px 8px 30px; display: grid; gap: 4px; font-size: 12px; color: var(--muted-foreground); }
.check-body button { text-align: left; }
.check-body button:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 2px; }
.side-block { padding: 12px; border-top: 1px solid var(--border); display: grid; gap: 8px; }
.note { font-size: 11px; line-height: 1.5; color: var(--muted-foreground); }
.alert { font-size: 12px; line-height: 1.45; border-radius: 6px; padding: 6px 8px; background: var(--destructive-soft); color: var(--destructive); }
.hint { font-size: 12px; line-height: 1.45; border-radius: 6px; padding: 6px 8px; background: var(--primary-soft); color: var(--primary); }

/* Postings */
.post-detail { padding: 16px; display: grid; gap: 12px; max-width: 820px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; }
.card-head .t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.card-head h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.card-sec { border-top: 1px solid var(--border); padding: 12px 16px; display: grid; gap: 8px; }
.meter { display: flex; align-items: center; gap: 12px; }
.meter .big { font-family: var(--font-mono); font-size: 20px; font-weight: 600; }
.ticks { display: flex; flex-wrap: wrap; gap: 3px; }
.tick { width: 14px; height: 8px; border-radius: 2px; border: 1px solid var(--border); }
.tick.yes { background: var(--ok); border-color: var(--ok); }
.tick.learning { background: var(--primary); border-color: var(--primary); }
.tick.partly { background: var(--warn); border-color: var(--warn); }
.st-todo { --s: var(--st-todo); } .st-wip { --s: var(--st-wip); } .st-applied { --s: var(--st-applied); }
.st-interview { --s: var(--st-interview); } .st-offer { --s: var(--st-offer); } .st-closed { --s: var(--st-closed); }
.ptop { flex: none; display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.pstats { display: flex; gap: 14px; font-size: 12px; color: var(--muted-foreground); }
.pstats b { color: var(--foreground); font-weight: 600; }
.pstats .hot, .pstats .hot b { color: var(--destructive); }
.attn { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px 0; }
.attn-h { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--destructive); }
.attn-item { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12px; border: 1px solid; }
.attn-item.lvl-overdue, .attn-item.lvl-urgent { color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 40%, transparent); background: var(--destructive-soft); }

    return { kind: ok ? "ok" : "bad", label: "Graduate by " + termName(termAt(goal).id), n: shortTerm(early.id),

  const SHORT_GROUP = { lower: "Lower-division", foundation: "Foundation", core: "Junior core", major: "Accounting major", senior: "Senior" };
  function rail(ctx, terms, status) {

    const planned = REQUIRED.filter(c => ["planned", "bad"].includes(status(c))).length;
    const early = earliestFinish();
    const pct = (n, of) => (100 * n / of).toFixed(1) + "%";

    const dup = findDuplicate(fields.link, editingId);

    let id = editingId;

    } else {

  // ---------- Resume help (no AI: plain matching) ----------
  // Work that shows a skill without naming it, and the words postings use for it
  const RESUME_HINTS = {

    cost: [/change orders?|materials?|job cost|project cost|supply costs?/, "job costing"],
    recon: [/\bmatch(ed|ing)?\b|tie[sd]? out|balanc(e|ed|ing) the/, "account reconciliations"],
    journal: [/bookkeeping|record(ed|ing)?\b.*(expense|transaction|account|sale)/, "journal entries"],
    payroll: [/wages|tips|paychecks?|timesheets?/, "payroll"],
    excel: [/spreadsheets?|workbooks?/, "Excel"],
    "fin-statements": [/10-k|balance sheet|income statement|ratios?/, "financial statements"],
    communication: [/present(ed|ing)?|emails?|clients?|explain(ed|ing)?/, "communication"],
    detail: [/\bcheck(ed|ing)?\b|review(ed|ing)?|verif(y|ied)|mistakes?|errors?|accura/, "attention to detail"],
    teamwork: [/\bteam\b|coworkers?|with the (accounting|project)/, "teamwork"],
    tax: [/\btax/, "tax preparation"],
    analytical: [/analy[sz]/, "analysis"],
    budget: [/budget|forecast/, "budgeting"],
    "month-end": [/month[- ]end|closing the books/, "month-end close"],
    controls: [/approv(al|ed|e)|segregat/, "internal controls"],

  function resumeBullets(profile) {
    return String(profile.resume || "").split("\n").map(b => b.replace(/^[\s•\-*·]+/, "").trim()).filter(b => b.length > 3);
  }
  function resumeEvidence(profile) {
    const ids = new Set();
    for (const b of resumeBullets(profile)) {
      const low = b.toLowerCase();
      for (const sk of SKILLS) if (sk.re.test(low) || (RESUME_HINTS[sk.id] && RESUME_HINTS[sk.id][0].test(low))) ids.add(sk.id);
    }
    return ids;
  }
  function resumeAdvice(skills, have) {
    const bullets = resumeBullets(state.profile);
    if (!bullets.length) return null;
    const ids = [...new Set(skills.map(s => s.id).filter(id => SKILL_BY_ID[id]))];
    const scored = bullets.map(b => {
      const low = b.toLowerCase();
      const direct = ids.filter(id => SKILL_BY_ID[id].re.test(low));
      const implied = ids.filter(id => !direct.includes(id) && RESUME_HINTS[id] && RESUME_HINTS[id][0].test(low));
      return { b, direct, implied, score: direct.length * 2 + implied.length };
    });
    const lead = scored.filter(x => x.score).sort((a, b) => b.score - a.score).slice(0, 3);
    const reword = [];
    for (const id of ids) {
      if (scored.some(x => x.direct.includes(id))) continue;
      const hit = scored.find(x => x.implied.includes(id));
      if (hit) reword.push({ id, bullet: hit.b, phrase: RESUME_HINTS[id][1] });
    }
    const unshown = ids.filter(id => have[id] === "yes" && !scored.some(x => x.direct.includes(id) || x.implied.includes(id)));
    return { lead, reword, unshown };
  }

        " to see which ones to lead with for this job."));

    }
    if (adv.lead.length) kids.push(h("div", { class: "rs-list" }, h("span", { class: "rs-h" }, "Lead with these bullets"),
      ...adv.lead.map(x => h("div", { class: "rs-item" }, h("span", null, clip(x.b)),
        h("span", { class: "chips" }, ...[...x.direct, ...x.implied].map(id => h("span", { class: "badge ok" }, SKILL_BY_ID[id].name)))))));
    if (adv.reword.length) kids.push(h("div", { class: "rs-list" }, h("span", { class: "rs-h" }, "Use this posting's words"),
      ...adv.reword.map(x => h("div", { class: "rs-item warn" },

    if (adv.unshown.length) kids.push(h("div", { class: "rs-list" }, h("span", { class: "rs-h" }, "You have these, but no bullet shows them"),

    if (!adv.lead.length && !adv.reword.length && !adv.unshown.length) kids.push(h("p", { class: "note" }, "None of your bullets match what this posting asks for yet. Check the missing skills above."));
    return h("div", { class: "card-sec" }, ...kids);
  }

  // How many postings ask for each skill, and where the student stands on it
  function skillTally(have, posts) {
    const tally = {};
    const rank = { no: 0, partly: 1, yes: 2 };
    for (const p of posts) {
      const seen = new Set();
      for (const s of analyze(p, have)) {
        if (seen.has(s.id)) continue; seen.add(s.id);
        const t = tally[s.id] || (tally[s.id] = { id: s.id, name: s.name, count: 0, have: s.have });
        t.count++;
        if (rank[s.have] > rank[t.have]) t.have = s.have;
      }
    }
    for (const t of Object.values(tally)) if (SKILL_BY_ID[t.id] && have[t.id]) t.have = have[t.id];
    return Object.values(tally).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  }

  ];
  function jobType(p) {
    const role = (p.role + " " + p.company).toLowerCase(), text = p.text.toLowerCase();
    for (const [name, re] of JOB_TYPES) if (re.test(role)) return name;
    for (const [name, re] of JOB_TYPES) if (re.test(text.slice(0, 400))) return name;
    return "Other";
  }

            statusIcon(status(r)), r.name, h("span", { class: "mono muted", style: "font-size:11px" }, r.count + "/" + list.length)))));
      })));
    kids.push(h("section", { class: "card" }, h("div", { class: "card-sec", style: "border-top:0" },
      h("div", { class: "kicker" }, "Where to find more postings"),
      h("p", { class: "note" }, "Handshake (GSU's job board) and Robinson career fairs · Big 4 and national firm careers pages (RSM, Grant Thornton, BDO, Crowe) · Atlanta CPA firms via the Georgia Society of CPAs · GSU groups: Beta Alpha Psi, Tau Alpha Chi, NABA, ALPFA, ASCEND."),

  // ---------- Skills ----------
  function openSkill(id) {

    const el = document.getElementById("guide-" + id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function tagBox(key, inputId, placeholder, show) {
    const items = state.profile[key];
    const input = h("input", { type: "text", id: inputId, placeholder, "aria-label": placeholder,
      onkeydown: e => {
        if (e.key === "Enter" || e.key === ",") { e.preventDefault(); const v = e.target.value; e.target.value = ""; addTag(key, v); }
        else if (e.key === "Backspace" && !e.target.value) {
          const i = items.map((t, j) => [t, j]).filter(([t]) => !show || show(t)).map(([, j]) => j).pop();
          if (i !== undefined) { items.splice(i, 1); commit(); }
        }
      },
      onblur: e => { if (e.target.value.trim()) { const v = e.target.value; e.target.value = ""; addTag(key, v); } } });
    return h("div", { class: "tags" }, ...items.map((t, i) => (show && !show(t)) ? null : h("span", { class: "tag" }, t,
      h("button", { type: "button", "aria-label": "Remove " + t, onclick: () => { items.splice(i, 1); commit(); } }, icon("x", "sm")))), input);
  }

  function skillsView(have) {
    const p = state.profile;
    const gsuTaken = p.classes.filter(c => gsuCourseFor(c)).length;
    const left = [scroller("mine",
      h("div", { class: "side-sec" }, h("h3", null, "About you"),
        h("label", { class: "field" }, "Name", h("input", { class: "input", id: "p-name", type: "text", value: p.name, onchange: e => { ensureOwn(); state.profile.name = e.target.value.trim(); commit(); } })),
        h("div", { class: "form-grid" },
          h("label", { class: "field" }, "Year", h("select", { class: "input", id: "p-year", onchange: e => { ensureOwn(); state.profile.year = e.target.value; commit(); } },
            ...["Freshman", "Sophomore", "Junior", "Senior", "Graduate student"].map(y => h("option", { selected: y === p.year }, y)))),
          h("label", { class: "field" }, "Graduation", h("input", { class: "input", id: "p-grad", type: "text", value: p.grad, placeholder: "Dec 2027", onchange: e => { ensureOwn(); state.profile.grad = e.target.value.trim(); commit(); } })))),
      h("div", { class: "side-sec" }, h("h3", null, "My skills"),
        tagBox("skills", "skillInput", "Add a skill, then Enter"),
        h("p", { class: "note" }, "Or open any skill in the guide and tap \u201CI have this.\u201D")),
      h("div", { class: "side-sec" }, h("h3", null, "Resume bullets"),
        h("p", { class: "note" }, "Paste the bullets from your resume, one per line. Each posting then shows which ones to lead with and what to reword."),
        (() => {
          const ta = h("textarea", { class: "input", id: "p-resume", style: "min-height:150px;font-size:12.5px", placeholder: "Processed bi-weekly payroll for 6 staff\nTracked vendor invoices for 4 projects",
            onchange: e => { ensureOwn(); state.profile.resume = e.target.value; commit(); } });
          ta.value = p.resume;
          return ta;
        })()),
      h("div", { class: "side-sec" }, h("h3", null, "Classes"),
        h("p", { class: "note" }, gsuTaken + " GSU class" + (gsuTaken === 1 ? "" : "es") + " marked as taken. ",
          h("button", { type: "button", style: "text-decoration:underline;text-underline-offset:2px", onclick: () => { ui.view = "plan"; ui.libFilter = "all"; ui.pane.plan = "left"; render(); } }, "Mark them in Plan"), "."),
        h("span", { class: "field" }, h("span", null, "Other classes ", h("span", { class: "muted" }, "· transfer or not listed"))),
        tagBox("classes", "classInput", "Add a class, then Enter", c => !gsuCourseFor(c))),
      h("div", { class: "side-sec" }, h("h3", null, "Your data"),
        h("p", { class: "note" }, "Everything saves in this browser only. Back up now and then, and restore the file to move to another device."),
        h("div", { class: "acts" },
          h("button", { type: "button", class: "btn sm", onclick: backup }, "Back up"),
          h("button", { type: "button", class: "btn sm", onclick: restore }, "Restore"))))];

    const center = [scroller("guide", h("div", { class: "guide" },
      h("div", { style: "display:grid;gap:4px" }, h("span", { class: "kicker" }, "Skill guide"),
        h("p", { class: "muted", style: "font-size:13px;max-width:70ch" }, "What each skill means, how to check yourself, and free places to learn it. Keep only the skills you could talk about in an interview.")),
      ...STATUS_SECTIONS.map(([key, label]) => {
        const ids = SKILLS.map(x => x.id).filter(id => shown(id, have[id] || "no") === key);
        return ids.length ? h("section", { class: "year" },
          h("div", { class: "status-head st-" + key }, statusIcon(key), h("span", null, label), h("span", { class: "cnt" }, ids.length)),
          h("div", null, ...ids.map(id => skillCard(id, have)))) : null;
      })))];

    const studying = p.learning.filter(id => (have[id] || "no") !== "yes");
    const right = [scroller("studying",
      h("div", { class: "verdict" },
        h("div", { class: "kicker" }, "Studying now"),
        h("div", { class: "headline" }, studying.length ? studying.length + (studying.length === 1 ? " skill" : " skills") : "Nothing yet"),
        h("div", { class: "detail" }, studying.length ? "Tap one to see where to learn it." : "Open a skill and tap “I'm learning this.”")),
      studying.length ? h("div", { class: "checks" }, ...studying.map(id => h("button", { type: "button", class: "skill-line", onclick: () => openSkill(id) },
        statusIcon("learning"), h("span", { class: "nm" }, SKILL_BY_ID[id].name)))) : null)];
    return panes({ left, center, right });
  }

  const STATUS_SECTIONS = [["yes", "You have"], ["learning", "Studying"], ["partly", "Partly, from classes"], ["no", "Not yet"]];
  const CATEGORY = {};
  for (const g of GUIDE_GROUPS) for (const id of g.ids) CATEGORY[id] = g.name;
  const STATUS_BADGE = { yes: ["ok-solid", "Have"], learning: ["primary", "Studying"], partly: ["warn", "Partly"], no: ["", "Not yet"] };
  const CAT_KEY = {};
  GUIDE_GROUPS.forEach((g, i) => { for (const id of g.ids) CAT_KEY[id] = ["acct", "soft", "people"][i]; });

  function skillCard(id, have) {
    const s = SKILL_BY_ID[id], info = GUIDE[id], base = have[id] || "no", v = shown(id, base);
    const src = skillSources(state.profile, s);
    const card = h("details", { class: "skill-card is-" + v, id: "guide-" + id, open: ui.openSkills.has(id) },
      h("summary", null, statusIcon(v), h("span", { class: "nm" }, s.name),
        h("span", { class: "cat cat-" + CAT_KEY[id] }, CATEGORY[id]),
        h("span", { class: "badge " + STATUS_BADGE[v][0] }, STATUS_BADGE[v][1])),
      h("div", { class: "skill-body" },
        h("div", null, h("h4", null, "What it is"), h("p", null, info.what)),
        h("div", null, h("h4", null, "You have it if"), h("p", null, info.check)),
        h("div", null, h("h4", null, "How to learn it"), h("ul", null, ...info.learn.map(x => h("li", null, x)))),
        LINKS[id] ? h("div", null, h("h4", null, "Free places to start"),
          h("div", { class: "links" }, ...LINKS[id].map(([label, url]) => h("a", { href: url, target: "_blank", rel: "noopener" }, label, icon("external", "sm"))))) : null,
        (src.tags.length || src.classes.length) ? h("p", { class: "note" },
          "Counted because of " + [...src.tags.map(t => "“" + t + "”"), ...src.classes].join(", ") + ".") : null,
        h("div", { class: "acts" },
          src.tags.length
            ? h("button", { class: "btn sm", type: "button", onclick: () => {
                state.profile.skills = state.profile.skills.filter(t => !src.tags.includes(t)); commit();
                toast("Removed " + s.name + " from your skills.");
              } }, "I don't have this yet")
            : h("button", { class: "btn sm primary", type: "button", onclick: () => { setLearning(id, false); addTag("skills", s.name); toast("Added " + s.name + " to your skills."); } }, icon("check"), "I have this"),
          base !== "yes" ? h("button", { class: "btn sm", type: "button", "aria-pressed": String(isLearning(id)), onclick: () => {
              const on = !isLearning(id); setLearning(id, on); commit();
              toast(on ? "Added " + s.name + " to Studying now." : "Took " + s.name + " off Studying now.");
            } }, icon("half"), isLearning(id) ? "Stop studying" : "I'm learning this") : null,
          src.classes.length && src.tags.length ? h("span", { class: "note" }, "Your classes still count toward it.") : null)));
    card.addEventListener("toggle", () => { if (card.open) ui.openSkills.add(id); else ui.openSkills.delete(id); });
    return card;
  }

  // ---------- Summary ----------
  function planText() {
    const ctx = planContext(), terms = planTerms(), status = statusFn(ctx), v = planVerdict(ctx, terms, status), p = state.profile;
    const early = earliestFinish();
    const lines = [];
    lines.push("Accounting B.B.A. plan" + (p.name ? " for " + p.name : "") + (p.grad ? ", graduating " + p.grad : ""));
    lines.push("Status: " + v.headline + ".");
    if (early && !early.done) lines.push("Earliest possible finish: " + termName(early.id) + (early.stretched ? " (with an 18-hour semester)" : "") + ".");
    const done = COURSES.filter(c => ctx.taken.has(c.code)).map(c => c.code);
    if (done.length) lines.push("", "Done or in progress: " + done.join(", "));
    for (const t of terms) {
      const codes = t.codes.filter(c => !ctx.taken.has(c));
      if (!codes.length) continue;
      lines.push("", termName(t.id) + " (" + termHours(t, ctx) + " hrs)");
      for (const code of codes) lines.push("  " + code + "  " + COURSE_BY_CODE[code].title);
    }
    if (v.open.length) lines.push("", "Not planned yet: " + v.open.join(", "));
    lines.push("", "Based on the " + CATALOG + ".");
    return lines.join("\n");
  }
  function copyPlan() {
    const text = planText();
    const fallback = () => {
      ui.dialog = { kind: "copy", live: false };
      const ta = h("textarea", { class: "input", id: "copy-text", readonly: true, style: "min-height:260px;font-family:var(--font-mono);font-size:12px" });
      dlg().replaceChildren(dialogHead(null, "Copy your plan", h("p", { class: "muted", style: "font-size:13px" }, "Copy this text and paste it into an email to your advisor.")),
        h("div", { class: "dlg-sec" }, ta));
      ta.value = text;
      if (!dlg().open) dlg().showModal();
      ta.focus(); ta.select();
    };
    try {
      navigator.clipboard.writeText(text).then(() => toast("Copied. Paste it into an email to your advisor."), fallback);
    } catch { fallback(); }
  }

  function summaryView(have) {
    const ctx = planContext(), terms = planTerms(), status = statusFn(ctx), v = planVerdict(ctx, terms, status), p = state.profile;
    const early = earliestFinish(), last = lastPlannedPos(ctx, terms);
    const facts = [
      ["Status", v.headline, null],
      ["Planned through", last >= 0 ? termName(terms[last].id) : "Nothing planned yet", null],
      ["Earliest possible", early ? (early.done ? "All required classes are done" : termName(early.id) + (early.stretched ? " (with an 18-hour semester)" : "")) : "More than 12 semesters out", null],
      ["Graduation goal", p.grad || "Not set", null],
    ];
    const reqRows = REQ_GROUPS.filter(g => g.id !== "elective").map(g => {
      const cs = COURSES.filter(c => c.req === g.id), open = cs.filter(c => status(c.code) === "open");
      return h("div", { class: "sum-row" }, h("span", { class: "k", style: "display:flex;align-items:center;gap:7px" }, h("i", { class: "gdot grp-" + g.id }), g.name),
        h("span", { class: "v" }, open.length ? "Not planned: " + open.map(c => c.code).join(", ") : "Done or planned"),
        h("span", { class: "n" }, (cs.length - open.length) + "/" + cs.length));
    });
    const termBlocks = terms.map((t, pos) => {
      const codes = t.codes.filter(c => !ctx.taken.has(c));
      return h("div", { class: "sum-term" },
        h("div", { class: "hd" }, h("span", null, termName(t.id)), h("span", { class: "mono muted", style: "font-weight:400;font-size:12px" }, codes.length + " classes · " + termHours(t, ctx) + "h")),
        ...(codes.length ? codes.map(code => {
          const c = COURSE_BY_CODE[code], iss = issuesFor(c, pos, ctx);
          return h("div", { class: "ln" }, h("span", { class: "mono" }, code), h("span", null, c.title),
            iss.hard.length ? h("span", { style: "color:var(--destructive);font-size:12px" }, iss.hard[0]) : h("span", { class: "mono muted", style: "font-size:12px" }, c.hrs + "h"));
        }) : [h("span", { class: "muted", style: "font-size:13px" }, "Nothing planned")]));
    });
    const done = COURSES.filter(c => ctx.taken.has(c.code));
    const byStatus = STATUSES.map(s => [STATUS_LABEL[s], state.postings.filter(x => x.status === s).length]).filter(([, n]) => n);
    const gaps = {};
    for (const post of state.postings) for (const s of analyze(post, have)) if (s.have !== "yes" && SKILL_BY_ID[s.id] && !have[s.id]) gaps[s.id] = (gaps[s.id] || 0) + 1;
    const topGaps = Object.entries(gaps).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => SKILL_BY_ID[id].name);
    return [scroller("summary", h("div", { class: "summary" },
      h("div", { class: "summary-head" },
        h("div", null, h("div", { class: "kicker" }, "Summary"),
          h("h1", null, (p.name ? p.name + "'s " : "") + "Accounting B.B.A. plan"),
          h("p", { class: "muted", style: "font-size:13px" }, [p.year, p.grad ? "graduating " + p.grad : null, "Georgia State University"].filter(Boolean).join(" · "))),
        h("div", { class: "acts" },
          h("button", { type: "button", class: "btn sm", onclick: backup }, "Back up"),
          h("button", { type: "button", class: "btn sm", onclick: restore }, "Restore"),
          h("button", { type: "button", class: "btn primary sm", onclick: copyPlan }, icon("copy"), "Copy for my advisor"))),
      h("section", { class: "card" }, ...facts.map(([k, val]) => h("div", { class: "sum-row" }, h("span", { class: "k" }, k), h("span", { class: "v" }, val), h("span")))),
      h("div", { class: "kicker", style: "margin-top:6px" }, "Requirements"),
      h("section", { class: "card" }, ...reqRows),
      h("div", { class: "kicker", style: "margin-top:6px" }, "Semesters"),
      h("section", { class: "card" }, ...(termBlocks.length ? termBlocks : [h("div", { class: "sum-term" }, h("span", { class: "muted" }, "No semesters yet. Set them up in Plan."))])),
      h("div", { class: "kicker", style: "margin-top:6px" }, "Done or in progress"),
      h("section", { class: "card" }, h("div", { class: "sum-row" }, h("span", { class: "k" }, done.length + " classes"),
        h("span", { class: "v" }, done.length ? done.map(c => c.code).join(", ") : "None marked yet"), h("span"))),
      h("div", { class: "kicker", style: "margin-top:6px" }, "Internships"),
      h("section", { class: "card" },
        h("div", { class: "sum-row" }, h("span", { class: "k" }, state.postings.length + " postings"),
          h("span", { class: "v" }, byStatus.length ? byStatus.map(([s, n]) => n + " " + s.toLowerCase()).join(" · ") : "None added yet"), h("span")),
        h("div", { class: "sum-row" }, h("span", { class: "k" }, "Skills to work on"),
          h("span", { class: "v" }, !state.postings.length ? "Add postings to see which skills they ask for" : topGaps.length ? topGaps.join(", ") : "Nothing missing from your postings"), h("span"))),
      h("p", { class: "note" }, "Based on the " + CATALOG + ". Confirm the plan with a Robinson advisor.")))];
  }

  // ---------- Back up and restore ----------
  // On a static site the plan lives only in this browser, so a file backup is the way to keep or move it
  const inClaude = () => !!(window.claude && typeof window.claude.use === "function");
  function backupText() {
    const { example, ...data } = state;
    return JSON.stringify({ app: "internship-ledger", version: 1, savedAt: new Date().toISOString(), ...data }, null, 2);
  }
  function backup() {
    const text = backupText();
    if (inClaude()) {
      // Downloads don't work inside a Claude page, so hand over the text instead
      ui.dialog = { kind: "backup", live: false };
      const ta = h("textarea", { class: "input", id: "backup-text", readonly: true, style: "min-height:260px;font-family:var(--font-mono);font-size:11.5px" });
      dlg().replaceChildren(dialogHead(null, "Your backup", h("p", { class: "muted", style: "font-size:13px" }, "Copy this text into a file named backup.json.")), h("div", { class: "dlg-sec" }, ta));
      ta.value = text;
      if (!dlg().open) dlg().showModal();
      ta.focus(); ta.select();
      return;
    }
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const a = h("a", { href: url, download: "internship-ledger-backup-" + new Date().toISOString().slice(0, 10) + ".json" });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Backup saved. Check your Downloads folder.");
  }
  function restore() {
    const input = h("input", { type: "file", accept: "application/json,.json" });
    input.addEventListener("change", () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let next;
        try { const raw = JSON.parse(reader.result); if (!raw || !raw.profile) throw new Error("not a backup"); next = normalize(raw); }
        catch { toast("That file isn't an Internship Ledger backup."); return; }
        ui.dialog = { kind: "restore", live: false };
        dlg().classList.remove("palette");
        const taken = next.profile.classes.length, posts = next.postings.length;
        dlg().replaceChildren(
          dialogHead(null, "Restore this backup?", h("p", { class: "muted", style: "font-size:13px" },
            file.name + ": " + taken + " classes, " + next.plan.terms.length + " semesters, " + posts + " postings. This replaces everything in the app now.")),
          h("div", { class: "dlg-foot" },
            h("button", { type: "button", class: "btn ghost", onclick: closeDialog }, "Cancel"),
            h("button", { type: "button", class: "btn primary", onclick: () => { state = next; closeDialog(); commit(); toast("Backup restored."); } }, "Replace my data")));
        if (!dlg().open) dlg().showModal();
      };
      reader.readAsText(file);
    });
    input.click();
  }

  // ---------- Command palette (⌘K) ----------
  function openPalette() {
    ui.dialog = { kind: "palette", live: false };
    const go = view => () => { ui.view = view; render(); };
    const everything = [
      { label: "Fill in remaining classes", hint: "Action", run: () => { ui.view = "plan"; fillIn(); } },
      { label: "Add a posting", hint: "Action", run: () => openPostingForm(null) },
      { label: "Add a term", hint: "Action", run: () => { addTerm(); ui.view = "plan"; commit(); } },
      { label: "Copy plan for my advisor", hint: "Action", run: copyPlan },
      { label: "Back up my data", hint: "Action", run: backup },
      { label: "Restore from a backup", hint: "Action", run: restore },
      ...VIEWS.map(v => ({ label: "Go to " + v.label, hint: "View", run: go(v.id) })),
      ...COURSES.map(c => ({ label: c.code + " " + c.title, hint: "Class", run: () => { ui.view = "plan"; render(); openCourse(c.code); } })),
      ...SKILLS.map(s => ({ label: s.name, hint: "Skill", run: () => openSkill(s.id) })),
      ...state.postings.map(p => ({ label: (p.company || "Untitled posting") + (p.role ? " · " + p.role : ""), hint: "Posting",
        run: () => { ui.view = "postings"; ui.postTab = "board"; render(); openPosting(p.id); } })),
    ];
    const input = h("input", { class: "input", id: "pal-q", type: "search", autocomplete: "off", placeholder: "Search classes, skills, postings, or actions…", "aria-label": "Search everything" });
    const list = h("div", { class: "pal-list", role: "listbox", "aria-label": "Results" });
    let items = [], sel = 0;
    const mark = () => [...list.querySelectorAll(".pal-item")].forEach((el, i) => el.setAttribute("aria-selected", String(i === sel)));
    const run = i => { const it = items[i]; if (!it) return; closeDialog(); it.run(); };
    const draw = () => {
      const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
      items = everything.filter(it => words.every(w => (it.label + " " + it.hint).toLowerCase().includes(w))).slice(0, 14);
      sel = Math.min(sel, Math.max(items.length - 1, 0));
      list.replaceChildren(...(items.length
        ? items.map((it, i) => h("button", { type: "button", class: "pal-item", role: "option", "aria-selected": String(i === sel),
            onmousemove: () => { if (sel !== i) { sel = i; mark(); } }, onclick: () => run(i) },
            h("span", { class: "pal-label" }, it.label), h("span", { class: "pal-hint" }, it.hint)))
        : [h("p", { class: "note", style: "padding:12px" }, "No matches.")]));
    };
    input.addEventListener("input", () => { sel = 0; draw(); });
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        sel = Math.max(0, Math.min(items.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1)));
        mark(); const el = list.querySelectorAll(".pal-item")[sel]; if (el) el.scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") { e.preventDefault(); run(sel); }
    });
    dlg().classList.add("palette");
    dlg().replaceChildren(h("div", { class: "search pal-search" }, icon("search"), input), list);
    draw();
    if (!dlg().open) dlg().showModal();
    input.focus();
  }

  // ---------- Wiring ----------
  dlg().addEventListener("close", () => { ui.dialog = null; dlg().classList.remove("palette"); });
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (ui.dialog && ui.dialog.kind === "palette") closeDialog(); else openPalette(); }
  });
  dlg().addEventListener("click", e => { if (e.target === dlg()) closeDialog(); });
  document.getElementById("startOwn").addEventListener("click", () => {
    state = starterState(); ui.view = "plan"; ui.libFilter = "all"; ui.pane.plan = "left"; commit();
    toast("Started your own plan. First, mark the GSU classes you've taken.");
  });


  render();
  initAccount();
})();
</script>
